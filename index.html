<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>add</title>

    <style>
        body {
            margin: 0;
            background: #111;
            overflow: hidden;
        }

        .particle {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 0 6px currentColor;
        }
        
        .birthday-message {
            position: absolute;
            top: 8%;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            text-align: center;
            color: #ffd166;
            font-size: clamp(24px, 4vw, 42px);
            font-weight: bold;
            font-family: "Georgia", serif;
            text-shadow:
                0 0 8px #ff9f1c,
                0 0 18px #ff8fab,
                0 0 30px #ff8fab;
            animation: glow 2s ease-in-out infinite alternate;
            z-index: 10;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 8px #ff9f1c,
                            0 0 18px #ff8fab;
            }
            to {
                text-shadow: 0 0 15px #ffd166,
                            0 0 30px #ff8fab,
                            0 0 45px #ff8fab;
            }
        }
        /* Sao lấp lánh */
        .sparkle {
            position: absolute;
            color: #ffd166;
            font-size: 20px;
            pointer-events: none;
            animation: sparkle 2s ease-in-out infinite alternate;
            text-shadow: 0 0 10px currentColor,
                        0 0 20px currentColor;
        }

        @keyframes sparkle {
            from {
                opacity: 0.2;
                transform: scale(0.6) rotate(0deg);
            }
            to {
                opacity: 1;
                transform: scale(1.3) rotate(45deg);
            }
        }

        /* Trái tim bay */
        .heart {
            position: absolute;
            color: #ff8fab;
            font-size: 24px;
            pointer-events: none;
            animation: float 4s ease-in-out infinite;
            text-shadow: 0 0 12px #ff4d8d;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-20px) scale(1.2);
            }
        }

        /* Pháo hoa */
        .firework {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #ffd166;
            box-shadow: 0 0 10px #ffd166,
                        0 0 20px #ff8fab;
            animation: firework 1.5s ease-in-out infinite alternate;
        }

        @keyframes firework {
            from {
                opacity: 0.2;
                transform: scale(0.5);
            }
            to {
                opacity: 1;
                transform: scale(2);
            }
        }

        /* Dây cờ sinh nhật */
        .bunting {
            position: absolute;
            top: 3%;
            left: 5%;
            width: 90%;
            height: 35px;
            border-top: 2px solid #ffd166;
            border-radius: 50%;
            pointer-events: none;
        }

        .bunting::before {
            content: "🔺 🟡 🔺 🩷 🔺 🟡 🔺 🩷 🔺";
            position: absolute;
            top: 5px;
            left: 5%;
            font-size: 16px;
            letter-spacing: 8px;
        }
    </style>
</head>

<body>
    
    <div class="birthday-message">
        🎂 Chúc Mừng Sinh Nhật Ba 
    </div>

    <script>
        const particles = [];
        const total = 1500;

        // Tạo tọa độ các hạt
        const targets = [];

        const cx = window.innerWidth / 2;
        const cy = window.innerHeight / 2;

        // Hàm thêm một tọa độ
        function addTarget(x, y, color) {
            targets.push({ x, y, color });
        }

        // 1. Đáy bánh: hình elip
        for (let a = 0; a < Math.PI * 2; a += 0.035) {
            addTarget(
                cx + Math.cos(a) * 155,
                cy + 100 + Math.sin(a) * 25,
                "#ffd166"
            );
        }

        // 2. Thân bánh: hai tầng
        for (let y = -65; y <= 65; y += 5) {
            const width = y < 0 ? 95 : 145;

            for (let x = -width; x <= width; x += 5) {
                // Chỉ lấy hạt nằm gần viền hoặc rải đều bên trong
                if (
                    Math.random() < 0.35 ||
                    Math.abs(x) > width - 8
                ) {
                    addTarget(
                        cx + x,
                        cy + 45 + y,
                        y < -5 ? "#ff8fab" : "#ffcad4"
                    );
                }
            }
        }

        // 3. Viền kem trên bánh
        for (let a = 0; a < Math.PI * 2; a += 0.035) {
            addTarget(
                cx + Math.cos(a) * 100,
                cy - 25 + Math.sin(a) * 18,
                "#fff1c1"
            );

            addTarget(
                cx + Math.cos(a) * 150,
                cy + 35 + Math.sin(a) * 22,
                "#fff1c1"
            );
        }

        // 4. Ba cây nến
        for (let candleX of [-55, 0, 55]) {
            for (let y = -145; y <= -85; y += 4) {
                for (let x = -5; x <= 5; x += 4) {
                    addTarget(
                        cx + candleX + x,
                        cy + y,
                        "#fff0b3"
                    );
                }
            }

            // Ngọn lửa
            for (let i = 0; i < 18; i++) {
                addTarget(
                    cx + candleX + (Math.random() - 0.5) * 13,
                    cy - 155 - Math.random() * 18,
                    "#ff9f1c"
                );
            }
        }

        // 5. Tạo particle và cho chúng bay đến mục tiêu
        for (let i = 0; i < total; i++) {
            const el = document.createElement("div");
            el.className = "particle";
            document.body.appendChild(el);

            const target = targets[i % targets.length];

            particles.push({
                element: el,

                // Vị trí xuất phát ngẫu nhiên
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,

                // Vị trí cố định cần đến
                targetX: target.x,
                targetY: target.y,

                color: target.color
            });

            el.style.background = target.color;
            el.style.color = target.color;
        }

        // 6. Chuyển động
        function animate() {
            for (const p of particles) {
                // Tiến gần đến vị trí mục tiêu
                p.x += (p.targetX - p.x) * 0.04;
                p.y += (p.targetY - p.y) * 0.04;

                p.element.style.left = p.x + "px";
                p.element.style.top = p.y + "px";
            }

            requestAnimationFrame(animate);
        }

        animate();
                // 7. Tạo sao trang trí
        const decorations = ["✦", "✧", "★", "✴"];

        for (let i = 0; i < 35; i++) {
            const star = document.createElement("div");

            star.className = "sparkle";
            star.textContent =
                decorations[Math.floor(Math.random() * decorations.length)];

            star.style.left = Math.random() * 100 + "vw";
            star.style.top = Math.random() * 100 + "vh";
            star.style.animationDelay = Math.random() * 2 + "s";
            star.style.color =
                ["#ffd166", "#fff1c1", "#ff8fab", "#cdb4db"][
                    Math.floor(Math.random() * 4)
                ];

            document.body.appendChild(star);
        }

        // 8. Tạo trái tim bay xung quanh
        for (let i = 0; i < 12; i++) {
            const heart = document.createElement("div");

            heart.className = "heart";
            heart.textContent = "♥";

            heart.style.left = Math.random() * 100 + "vw";
            heart.style.top = Math.random() * 100 + "vh";
            heart.style.animationDelay = Math.random() * 4 + "s";

            document.body.appendChild(heart);
        }

        // 9. Tạo các đốm sáng pháo hoa
        for (let i = 0; i < 60; i++) {
            const firework = document.createElement("div");

            firework.className = "firework";
            firework.style.left = Math.random() * 100 + "vw";
            firework.style.top = Math.random() * 100 + "vh";
            firework.style.animationDelay = Math.random() * 1.5 + "s";

            document.body.appendChild(firework);
        }

        // 10. Dây cờ sinh nhật
        const bunting = document.createElement("div");
        bunting.className = "bunting";
        document.body.appendChild(bunting);
    </script>
</body>
</html>
